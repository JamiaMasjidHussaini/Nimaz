<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Usta Muhammad, Balochistan, Pakistan Prayer Timings</title>
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-card: #ffffff;
      --bg-soft: #f4f9f6;
      --green-dark: #0b4f2c;
      --green-mid: #146c3e;
      --green-light: #e7f3ec;
      --gold: #c99a2e;
      --gold-light: #f9f1dc;
      --border-soft: #cfe2d7;
      --text-main: #0b4f2c;
      --text-muted: #2d6a49;
      --shadow: 0 3px 10px rgba(11, 79, 44, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .top-gold-bar {
      height: 6px;
      width: 100%;
      background: linear-gradient(90deg, #b8861b 0%, #e5be5a 50%, #b8861b 100%);
    }

    .sub-gold-strip {
      height: 2px;
      width: 100%;
      background-color: var(--gold);
      opacity: 0.65;
    }

    .app-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 12px 12px 28px;
      background-color: var(--bg-page);
    }

    .header-box {
      background-color: var(--bg-page);
      border: 1px solid var(--border-soft);
      border-top: 4px solid var(--gold);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    .location-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--gold-light);
      color: var(--green-dark);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .main-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--green-dark);
      letter-spacing: 0.2px;
    }

    .gold-divider {
      width: 72px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 8px auto 0;
      border-radius: 2px;
    }

    .mode-switch-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .mode-switch {
      display: inline-flex;
      background-color: var(--bg-soft);
      border: 1.5px solid var(--gold);
      border-radius: 999px;
      padding: 3px;
      gap: 4px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--green-dark);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 7px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background-color: var(--green-dark);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(11, 79, 44, 0.2);
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-soft);
      border: 1px solid var(--border-soft);
      border-bottom: 2px solid var(--gold);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 12px;
      gap: 8px;
    }

    .nav-arrow-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      background-color: #ffffff;
      color: var(--green-dark);
      font-size: 1.1rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav-arrow-btn:active {
      background-color: var(--gold-light);
    }

    .nav-center {
      text-align: center;
      flex: 1;
      min-width: 0;
    }

    .nav-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--green-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .month-select {
      margin-top: 4px;
      border: 1px solid var(--gold);
      border-radius: 6px;
      background-color: #ffffff;
      color: var(--green-dark);
      font-weight: 700;
      font-size: 0.78rem;
      padding: 3px 8px;
      outline: none;
    }

    .section-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--gold-light);
      border-left: 4px solid var(--gold);
      border-right: 4px solid var(--gold);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--green-dark);
    }

    .daily-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 540px) {
      .daily-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .time-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-top: 3px solid var(--gold);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 104px;
    }

    .card-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 5px;
      color: var(--green-dark);
    }

    .prayer-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--green-mid);
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(201, 154, 46, 0.35);
      width: 82%;
      margin-bottom: 6px;
    }

    .prayer-time {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--green-dark);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.2px;
    }

    .monthly-wrap {
      display: none;
      background-color: #ffffff;
      border: 1px solid var(--border-soft);
      border-top: 3px solid var(--gold);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table.timings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
      min-width: 540px;
      color: var(--green-dark);
    }

    table.timings-table thead th {
      background-color: var(--green-dark);
      color: #ffffff;
      font-weight: 700;
      padding: 8px 5px;
      border-bottom: 2px solid var(--gold);
      text-align: center;
      white-space: nowrap;
    }

    table.timings-table thead th small {
      display: block;
      font-size: 0.62rem;
      font-weight: 500;
      color: #f4dc98;
    }

    table.timings-table tbody td {
      padding: 6px 5px;
      border-bottom: 1px solid #e2efe7;
      text-align: center;
      font-weight: 700;
      color: var(--green-dark);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    table.timings-table tbody tr:nth-child(even) td {
      background-color: var(--bg-soft);
    }

    table.timings-table tbody td:first-child {
      background-color: var(--gold-light);
      color: var(--green-dark);
      font-weight: 800;
      border-right: 1px solid rgba(201, 154, 46, 0.45);
      position: sticky;
      left: 0;
      z-index: 1;
    }

    table.timings-table thead th:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      background-color: var(--green-dark);
    }

    .footer-gold-note {
      margin-top: 14px;
      border-top: 2px solid var(--gold);
      padding-top: 8px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--green-mid);
    }
  </style>
</head>
