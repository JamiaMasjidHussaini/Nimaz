    :root {

      --border-soft: #d9e6de;
      --text-main: #0b4f2c;
      --text-muted: #4b6356;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px 12px 32px;
      line-height: 1.4;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .header-box {
      background: var(--bg-card);
      border: 1.5px solid var(--gold);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      margin-bottom: 12px;
    }

    .loc-badge {
      display: inline-block;
      background: var(--gold-light);
      color: var(--green-dark);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .title {
      font-size: 19px;
      font-weight: 700;
      color: var(--green-dark);
    }

    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-soft);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 12px;
      gap: 8px;
    }

    .nav-btn {
      background: var(--green-light);
      color: var(--green-dark);
      border: 1px solid var(--green-mid);
      border-radius: 8px;
      width: 38px;
      height: 38px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .date-center {
      text-align: center;
      flex: 1;
    }

    .date-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--green-dark);
      margin-bottom: 4px;
    }

    .date-input {
      background: #ffffff;
      color: var(--green-dark);
      border: 1px solid var(--gold);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
    }

    .section-banner {
      background: var(--gold-light);
      border: 1px solid var(--gold);
      color: var(--green-dark);
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-top: 3px solid var(--green-mid);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }

    .card.highlight {
      border-top-color: var(--gold);
      background: #fffdf8;
    }

    .prayer-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--green-mid);
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--gold-light);
    }

    .prayer-time {
      font-size: 15px;
      font-weight: 700;
      color: var(--green-dark);
      letter-spacing: 0.2px;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 14px;
    }
  </style>
</head>
