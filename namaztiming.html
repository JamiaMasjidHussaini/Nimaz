      const prayerNames = [
        "Fajr",
        "Sun Rise",
        "Dahwa-e-kubra",
        "Zuhr",
        "Asr (Hanafi)",
        "Maghrib",
        "Isha (Hanafi)"
      ];

      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      function formatTimeParts(rawTime) {
        const match = rawTime.trim().match(/^(\d{1,2}:\d{2}):(\d{2})\s*(AM|PM)$/i);
        if (!match) {
          return `<span class="time-main">${rawTime}</span>`;
        }
        const hm = match[1];
        const sec = match[2];
        const period = match[3].toUpperCase();
        return `<span class="time-main">${hm}</span><span class="time-sec">:${sec}</span><span class="period">${period}</span>`;
      }

      function renderDailyPrayers() {
        const now = new Date();
        const monthIndex = now.getMonth();
        const dayNum = now.getDate();

        const mm = String(monthIndex + 1).padStart(2, "0");
        const dd = String(dayNum).padStart(2, "0");
        const key = `${mm}-${dd}`;

        const dateEl = document.getElementById("displayDate");
        const gridEl = document.getElementById("prayerGrid");

        dateEl.textContent = `${dayNum} ${monthNames[monthIndex]}`;

        const times = prayerSchedule[key];
        if (!times) {
          gridEl.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><div class="prayer-name">Schedule Notice</div><div class="time-main">Times not available for this date</div></div>`;
          return;
        }

        let cardsHtml = "";
        for (let i = 0; i < prayerNames.length; i++) {
          cardsHtml += `
            <div class="card">
              <div class="prayer-name">${prayerNames[i]}</div>
              <div>${formatTimeParts(times[i])}</div>
            </div>
          `;
        }
        gridEl.innerHTML = cardsHtml;
      }

      renderDailyPrayers();
    </script>

    <div class="footer">I Love Dawat-e-Islami</div>
  </div>
